import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCe_pxB8vaHoDnisO7z4YeBkLDyqYstzHw",

  messagingSenderId: "521107054226",
  appId: "1:521107054226:web:514021aebdf84ccf5f504b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docMap = doc(db, "arab_alliance", "map_data");
const docNames = doc(db, "arab_alliance", "names");
const docSupport = doc(db, "arab_alliance", "support");
const myClientId = Math.random().toString(36).slice(2);
let isApplying=false;
window.saveToCloud = async function(){
  if(isApplying) return;
  try{
    const now=Date.now();
    await Promise.all([
      setDoc(docMap, {data: window.DATA||DATA, updatedAt: now, clientId: myClientId}, {merge:true}),
      setDoc(docNames, {data: window.NAMES||NAMES, updatedAt: now, clientId: myClientId}, {merge:true}),
      setDoc(docSupport, {data: window.SUPPORT||SUPPORT, updatedAt: now, clientId: myClientId}, {merge:true})
    ]);
    console.log("☁️ تم النشر للجميع");
  }catch(e){ console.error(e); }
};
function applyAll(){ try{render();}catch(e){} try{renderAdmin();}catch(e){} try{updateNamesCount();}catch(e){} try{renderNamesManager();}catch(e){} }
async function initCloud(){
  let t=0; while(typeof DATA==='undefined' && t<80){ await new Promise(r=>setTimeout(r,100)); t++; }
  try{
    const [sMap, sNames, sSup] = await Promise.all([getDoc(docMap), getDoc(docNames), getDoc(docSupport)]);
    isApplying=true;
    if(sMap.exists() && sMap.data().data){ window.DATA=sMap.data().data; try{DATA=sMap.data().data;}catch(e){} }
    if(sNames.exists() && sNames.data().data){ window.NAMES=sNames.data().data; try{NAMES=sNames.data().data;}catch(e){} }
    if(sSup.exists() && sSup.data().data){ window.SUPPORT=sSup.data().data; try{SUPPORT=sSup.data().data;}catch(e){} }
    try{localStorage.setItem('arab_map_data', JSON.stringify(window.DATA)); localStorage.setItem('arab_names', JSON.stringify(window.NAMES)); localStorage.setItem('arab_support', JSON.stringify(window.SUPPORT));}catch(e){}
    applyAll(); isApplying=false;
  }catch(e){ isApplying=false; }
  onSnapshot(docMap, (snap)=>{ if(!snap.exists()) return; const d=snap.data(); if(d.clientId===myClientId) return; isApplying=true; if(d.data){ window.DATA=d.data; try{DATA=d.data;}catch(e){} } applyAll(); setTimeout(()=>{isApplying=false;},400); });
  onSnapshot(docNames, (snap)=>{ if(!snap.exists()) return; const d=snap.data(); if(d.clientId===myClientId) return; isApplying=true; if(d.data){ window.NAMES=d.data; try{NAMES=d.data;}catch(e){} } applyAll(); setTimeout(()=>{isApplying=false;},400); });
  onSnapshot(docSupport, (snap)=>{ if(!snap.exists()) return; const d=snap.data(); if(d.clientId===myClientId) return; isApplying=true; if(d.data){ window.SUPPORT=d.data; try{SUPPORT=d.data;}catch(e){} } applyAll(); setTimeout(()=>{isApplying=false;},400); });
}
(function(){ const o=localStorage.setItem.bind(localStorage); localStorage.setItem=function(k,v){ o(k,v); if(k.includes('arab_') && !isApplying) window.saveToCloud(); };})();
window.addEventListener('load', ()=>{ setTimeout(initCloud, 300); });
setTimeout(initCloud, 1000);
</script>

function deleteName(idx){
  try{
    idx=parseInt(idx);
    if(isNaN(idx)){ showToast('رقم غير صحيح'); return; }
    var nameToDelete = NAMES[idx];
    if(typeof nameToDelete==='undefined' || nameToDelete===null){
      showToast('غير موجود');
      console.log('NAMES length', NAMES.length, 'idx', idx);
      return;
    }
    console.log('🗑️ حذف', idx, nameToDelete);
    NAMES.splice(idx,1);
    try{ localStorage.setItem('arab_names', JSON.stringify(NAMES)); }catch(e){}
    try{ if(typeof updateNamesCount==='function') updateNamesCount(); }catch(e){}
    try{
      ['phase1','phase2'].forEach(function(ph){
        if(!DATA[ph]) return;
        Object.keys(DATA[ph]).forEach(function(bId){
          var b=DATA[ph][bId];
          if(b && b.players && b.players.length){
            b.players=b.players.filter(function(p){ return p!==nameToDelete; });
          }
        });
      });
      localStorage.setItem('arab_map_data', JSON.stringify(DATA));
      if(typeof renderAdmin==='function') renderAdmin();
    }catch(e){ console.error('clean buildings', e); }
    renderNamesManager();
    showToast('🗑️ تم حذف: '+nameToDelete);
  }catch(e){
    console.error('deleteName error', e);
    showToast('خطأ: '+e.message);
  }
}

function loadSupportToAdmin(){
  const cur=getAdminSupport();
  const n=document.getElementById('supportName');
  const t=document.getElementById('supportTitle');
  const d=document.getElementById('supportDesc');
  const badge=document.getElementById('supportPhaseBadge');
  if(badge) badge.textContent = adminPhase===1 ? 'المرحلة الأولى' : 'المرحلة الثانية';
  if(n) n.value=cur.name||'';
  if(t) t.value=cur.title||'';
  if(d) d.value=cur.desc||'';
}
function saveSupportFromAdmin(){
  const cur=getAdminSupport();
  const n=document.getElementById('supportName')?.value.trim();
  const t=document.getElementById('supportTitle')?.value.trim();
  const d=document.getElementById('supportDesc')?.value.trim();
  if(n) {
    cur.name=n;
    if(typeof NAMES!=='undefined' && !NAMES.includes(n)){
      NAMES.push(n);
      if(typeof saveNames==='function') saveNames();
      try{ updateGlobalDatalist(); updateNamesCount(); if(typeof renderNamesManager==='function') renderNamesManager(); }catch(e){}
    }
  }
  if(t) cur.title=t;
  if(d) cur.desc=d;
  saveSupport();
  renderSupport();
  showToast('تم حفظ دعم '+(adminPhase===1?'المرحلة الأولى':'الثانية')+': '+cur.name);
}
function resetSupport(){
  if(!confirm('استعادة دعم '+(adminPhase===1?'المرحلة الأولى':'الثانية')+' الافتراضي؟')) return;
  if(adminPhase===1) SUPPORT.phase1=JSON.parse(JSON.stringify(DEFAULT_SUPPORT_PHASE1));
  else SUPPORT.phase2=JSON.parse(JSON.stringify(DEFAULT_SUPPORT_PHASE2));
  saveSupport();
  loadSupportToAdmin();
  renderSupport();
}
function resetAllSupports(){
  if(!confirm('استعادة دعم المرحلتين معا؟')) return;
  SUPPORT=JSON.parse(JSON.stringify(DEFAULT_SUPPORT));
  saveSupport();
  loadSupportToAdmin();
  renderSupport();
}

function addPlayerToBuilding(bId){
  const input=document.getElementById('playersInput_'+bId);
  const name=input.value.trim();
  if(!name) return;
  const hidden=document.getElementById('players_'+bId);
  const current=hidden.value?hidden.value.split(',').map(s=>s.trim()).filter(Boolean):[];
  if(current.includes(name)){ alert('موجود بالفعل'); return; }
  current.push(name);
  hidden.value=current.join(', ');
  input.value='';
  const chipsBox=document.getElementById('chips_'+bId);
  chipsBox.innerHTML=current.map((p,i)=>'<span style="display:inline-flex; align-items:center; gap:4px; background:#2a241b; border:1px solid #3a3328; border-radius:999px; padding:2px 8px; font-size:11px">'+p.replace(/</g,'&lt;')+' <button onclick="removePlayerFromBuilding('+bId+','+i+')" style="border:0; background:#3a1a1a; color:#ff9a9a; width:16px; height:16px; border-radius:50%; cursor:pointer">✕</button></span>').join('');
  // auto add to global names if new
  if(!NAMES.includes(name)){ NAMES.push(name); saveNames(); try{ updateGlobalDatalist(); updateNamesCount(); }catch(e){} }
}
function removePlayerFromBuilding(bId, idx){
  const hidden=document.getElementById('players_'+bId);
  const current=hidden.value?hidden.value.split(',').map(s=>s.trim()).filter(Boolean):[];
  current.splice(idx,1);
  hidden.value=current.join(', ');
  const chipsBox=document.getElementById('chips_'+bId);
  chipsBox.innerHTML=current.map((p,i)=>'<span style="display:inline-flex; align-items:center; gap:4px; background:#2a241b; border:1px solid #3a3328; border-radius:999px; padding:2px 8px; font-size:11px">'+p.replace(/</g,'&lt;')+' <button onclick="removePlayerFromBuilding('+bId+','+i+')" style="border:0; background:#3a1a1a; color:#ff9a9a; width:16px; height:16px; border-radius:50%; cursor:pointer">✕</button></span>').join('');
}

function saveAdmin(){ 
  const key=adminPhase===1?'phase1':'phase2'; 
  const pd=DATA[key]; 
  BUILDINGS.forEach(b=>{ 
    const nameEl=document.getElementById('name_'+b.id);
    const labelEl=document.getElementById('label_'+b.id);
    const statusEl=document.getElementById('status_'+b.id);
    const playersEl=document.getElementById('players_'+b.id);
    if(!nameEl || !labelEl || !statusEl || !playersEl) return;
    const name=nameEl.value.trim()||b.label; 
    const label=labelEl.value.trim()||b.label; 
    const status=statusEl.value; 
    const playersRaw=playersEl.value.trim(); 
    const players=playersRaw?playersRaw.split(',').map(s=>s.trim()).filter(Boolean):[]; 
    b.label=label; 
    pd[b.id]={name,players}; 
    if(status) pd[b.id].status=status; 
  }); 
  saveSupportFromAdmin();
  saveData(); 
  closeAdmin(); 
}
function resetData(){ if(!confirm('استعادة كل البيانات (الخريطة + الأسماء + الدعم)؟')) return; localStorage.removeItem('arab_map_data'); localStorage.removeItem('arab_names'); localStorage.removeItem('arab_support'); DATA={phase1: JSON.parse(JSON.stringify(DEFAULT_PHASE1)), phase2: JSON.parse(JSON.stringify(DEFAULT_PHASE2))}; NAMES=JSON.parse(JSON.stringify(DEFAULT_NAMES)); SUPPORT=JSON.parse(JSON.stringify(DEFAULT_SUPPORT)); saveData(); saveNames(); saveSupport(); renderAdmin(); render(); }
function exportJSON(){ const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='arab_data.json'; a.click(); }

window.addEventListener('message', function(e){
  if(e.data && e.data.type==='arab_add_player'){
    const p=e.data.phase||1; const bid=e.data.buildingId||2; const name=e.data.player;
    const key=p==1?'phase1':'phase2';

      if(DATA[key][bid].players.indexOf(name)===-1){ DATA[key][bid].players.push(name); saveData(); render(); }
    }
  }
});
